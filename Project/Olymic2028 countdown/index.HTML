<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1>Countdown for Olympic 2028 🕊️</h1>
    <div class="countdown">
      <div class="box">
        <div id="box1">0</div>
        <span>Days</span>
      </div>
      <div class="box">
        <div id="box2">0</div>
        <span>Hours</span>
      </div>
      <div class="box">
        <div id="box3">0</div>
        <span>Minutes</span>
      </div>
      <div class="box">
        <div id="box4">0</div>
        <span>seconds</span>
      </div>
    </div>
    <footer>🏅 Los Angeles Olympics 2028 — Opening Ceremony: July 14, 2028</footer>
    <script src="app.js"></script>
  </div>
</body>
</html>
